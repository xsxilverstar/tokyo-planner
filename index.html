<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>✈️ 도쿄 Jun 6–8</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:14px;color:#1a1a1a;background:#f4f2ef;display:flex;flex-direction:column;}
:root{
  --d0:#993556;--d0lo:#F4C0D1;--d0bg:#FBEAF0;--d0th:#FBEAF0;--d0tl:#72243E;
  --d1:#854F0B;--d1lo:#FAC775;--d1bg:#FAEEDA;--d1th:#FAEEDA;--d1tl:#633806;
  --d2:#185FA5;--d2lo:#B5D4F4;--d2bg:#E6F1FB;--d2th:#E6F1FB;--d2tl:#0C447C;
  --bd:#e5e3de;--bg:#f4f2ef;--sf:#fff;
}

/* ── Header ── */
#hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 16px;height:50px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
#hdr h1{font-size:14px;font-weight:700;flex:1;}
#sync{font-size:11px;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;transition:all .3s;}
#sync.ok{background:#e6f9f0;color:#1a7a4a;}
#sync.saving{background:#f0f0f0;color:#666;}
#sync.err{background:#fff0f0;color:#cc3030;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* ── Tabs ── */
#tabs{display:flex;background:var(--sf);border-bottom:2px solid var(--bd);flex-shrink:0;}
.tab-btn{flex:1;padding:11px 8px;border:none;background:transparent;font-size:14px;font-weight:500;color:#999;cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:color .15s;}
.tab-btn.on{color:#1a1a1a;font-weight:700;border-bottom-color:#1a1a1a;}

/* ── Content ── */
#ca{flex:1;position:relative;overflow:hidden;}
.panel{position:absolute;inset:0;display:none;}
.panel.on{display:flex;}

/* ── Planner panel ── */
#pp{flex-direction:column;}
#pp-hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.hbtn{padding:7px 13px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.hbtn-l{background:var(--bg);color:#1a1a1a;}
.hbtn-d{background:#1a1a1a;color:#fff;}
#pi{display:flex;flex:1;overflow:hidden;}
#cal{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--sf);border-right:1px solid var(--bd);min-width:0;}
.dhr{display:flex;flex-shrink:0;border-bottom:1px solid var(--bd);}
.tgs{width:50px;flex-shrink:0;}
.dh{flex:1;padding:8px 8px;font-size:12px;font-weight:700;text-align:center;border-left:1px solid var(--bd);}
.dh0{background:var(--d0bg);color:var(--d0);}
.dh1{background:var(--d1bg);color:var(--d1);}
.dh2{background:var(--d2bg);color:var(--d2);}
#csc{overflow-y:auto;flex:1;}
#cgd{display:flex;}
#tg{width:50px;flex-shrink:0;position:relative;pointer-events:none;}
.tgl{position:absolute;right:6px;font-size:10px;color:#bbb;transform:translateY(-50%);white-space:nowrap;}
.dcol{flex:1;position:relative;border-left:1px solid var(--bd);cursor:crosshair;}
.dcol.dov{background:rgba(0,0,0,.04);}
.hl{position:absolute;left:0;right:0;border-top:1px solid #f0eeea;pointer-events:none;}
.hlh{border-top-style:dashed;opacity:.5;}
.eblk{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 7px;font-size:11px;cursor:pointer;overflow:hidden;border:none;text-align:left;z-index:5;transition:filter .1s,transform .1s;}
.eblk:hover{filter:brightness(1.07);transform:translateY(-1px);}
.eblk-t{font-weight:700;line-height:1.3;}
.eblk-tm{font-size:10px;opacity:.82;margin-top:1px;}
.eblk-l{font-size:10px;opacity:.68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.eblk-memo{font-size:10px;opacity:.68;overflow:hidden;text-overflow:ellipsis;margin-top:4px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.eblk-b{position:absolute;top:3px;right:5px;font-size:9px;font-weight:700;opacity:.7;}
#sb{width:260px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border-left:1px solid var(--bd);transition:width .28s cubic-bezier(.4,0,.2,1);}
#sb.col{width:34px;}
#sbt{display:flex;align-items:center;gap:7px;padding:9px 9px;background:#eae8e4;border-bottom:1px solid #d8d5ce;cursor:pointer;flex-shrink:0;white-space:nowrap;user-select:none;}
#sbt:hover{background:#dedad4;}
#sbc{font-size:13px;flex-shrink:0;color:#555;}
#sbtl{font-size:12px;font-weight:700;color:#666;}
#wp{flex:1;overflow-y:auto;padding:12px;border-bottom:1px solid var(--bd);}
.wphdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.wptitle{font-size:11px;font-weight:700;color:#888;letter-spacing:.5px;text-transform:uppercase;}
.witem{background:var(--sf);border:1.5px dashed #d8d5ce;border-radius:9px;padding:8px 10px;font-size:12px;margin-bottom:5px;cursor:grab;position:relative;user-select:none;transition:box-shadow .12s;}
.witem:hover{box-shadow:0 2px 8px rgba(0,0,0,.09);}
.witem.dg{opacity:.35;cursor:grabbing;}
.wt{font-weight:700;color:#666;}
.wl{font-size:11px;color:#999;margin-top:2px;}
.wdel{position:absolute;top:6px;right:7px;background:none;border:none;font-size:15px;color:#ccc;cursor:pointer;line-height:1;padding:0;}
.wadd{width:100%;padding:7px;border:1.5px dashed #d8d5ce;border-radius:9px;background:transparent;font-size:12px;color:#999;cursor:pointer;margin-top:2px;font-family:inherit;}
.wadd:hover{background:var(--sf);}
.wempty{text-align:center;font-size:11px;color:#bbb;padding:18px 8px;line-height:2;}
#pmp{height:270px;flex-shrink:0;position:relative;}
#pmap{height:100%;width:100%;}
#mf{position:absolute;top:6px;left:6px;z-index:1000;display:flex;gap:3px;}
.mfb{padding:3px 8px;border-radius:20px;border:none;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.mfb.off{opacity:.28;}
.gmbtn{position:absolute;bottom:6px;right:6px;z-index:1000;padding:4px 9px;background:var(--sf);border:1px solid #ddd;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:#1a73e8;}

/* ── Saturday panel (mobile-first, vertical scroll) ── */
#sp{flex-direction:column;overflow-y:auto;background:var(--bg);}
#sat{padding:14px;max-width:560px;width:100%;margin:0 auto;}
.sec{margin-bottom:20px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sec-title{font-size:15px;font-weight:700;}
.sec-sub{font-size:12px;color:#999;margin-top:2px;}
.act-row{display:flex;gap:8px;margin-bottom:14px;}
.act-btn{flex:1;padding:13px 8px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.act-add{background:#1a1a1a;color:#fff;}
.act-calc{background:var(--sf);color:#1a1a1a;border:1.5px solid var(--bd);}
.act-btn:active{opacity:.8;}

/* Checklist cards */
.ci{display:flex;align-items:flex-start;background:var(--sf);border-radius:12px;margin-bottom:8px;padding:13px;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.ci.done{opacity:.5;}
.ci-chk{flex-shrink:0;cursor:pointer;padding-top:1px;}
.cbox{width:24px;height:24px;border-radius:7px;border:2px solid #d8d5ce;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cbox.on{background:#30a46c;border-color:#30a46c;}
.cbox.on::after{content:'✓';color:#fff;font-size:14px;font-weight:700;}
.ci-body{flex:1;min-width:0;cursor:pointer;}
.ci-name{font-weight:700;font-size:14px;word-break:break-word;}
.ci.done .ci-name{text-decoration:line-through;color:#aaa;}
.ci.done .ci-where,.ci.done .ci-note{text-decoration:line-through;color:#ccc;}
.ci-where{font-size:12px;color:#888;margin-top:3px;}
.ci-note{font-size:12px;color:#aaa;margin-top:2px;}
.ci-badge{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
.ci-empty{text-align:center;font-size:13px;color:#bbb;padding:32px 16px;background:var(--sf);border-radius:12px;}

/* Route results */
#rtsec{display:none;margin-bottom:20px;}
.rt-tabs{display:flex;gap:6px;margin-bottom:10px;}
.rtbtn{flex:1;padding:10px 4px;border:1.5px solid var(--bd);border-radius:9px;background:var(--sf);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:#888;}
.rtbtn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.rt-card{background:var(--sf);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.rt-meta{display:flex;justify-content:space-between;margin-bottom:10px;}
.rt-lbl{font-size:13px;font-weight:700;}
.rt-km{font-size:12px;color:#888;}
.rt-path{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:12px;}
.rpi{display:flex;align-items:center;gap:3px;font-size:12px;}
.rpi-n{width:18px;height:18px;border-radius:50%;background:var(--bg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.rpi-dot{width:7px;height:7px;border-radius:50%;}
.rparr{font-size:11px;color:#ccc;}
.rt-open{display:block;width:100%;padding:11px;background:#1a73e8;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.rt-open:active{opacity:.9;}
.sat-map-wrap{border-radius:12px;overflow:hidden;height:260px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
#smap{height:100%;width:100%;}

/* ── Modals ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:flex-end;backdrop-filter:blur(2px);}
.mo.on{display:flex;}
/* On wider screens: center as box */
@media(min-width:580px){
  .mo.center{align-items:center;justify-content:center;}
  .msheet.box{border-radius:16px;width:380px;max-width:92vw;padding:22px;}
}
.msheet{background:var(--sf);border-radius:20px 20px 0 0;padding:20px 18px 34px;width:100%;max-height:92vh;overflow-y:auto;}
.msheet h3{font-size:16px;font-weight:700;margin-bottom:14px;}
.ff{margin-bottom:10px;}
.ff label{display:block;font-size:11px;font-weight:700;color:#888;margin-bottom:4px;}
.ff input,.ff select{width:100%;padding:10px 11px;border:1.5px solid var(--bd);border-radius:9px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;}
.ff input:focus,.ff select:focus{border-color:#1a1a1a;}
#ememo{resize:none;overflow-y:auto;min-height:40px;max-height:80px;line-height:1.5;font-family:inherit;font-size:14px;padding:10px 11px;border:1.5px solid var(--bd);border-radius:9px;width:100%;outline:none;display:block;}
#ememo:focus{border-color:#1a1a1a;}
.loc-row{display:flex;gap:7px;}
.loc-row input{flex:1;}
.geo-btn{padding:10px 13px;border:1.5px solid var(--bd);border-radius:9px;background:var(--bg);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.geo-btn:disabled{opacity:.5;}
.geo-st{font-size:11px;margin-top:4px;min-height:14px;}
.geo-ok{color:#1a7a4a;} .geo-fail{color:#cc3030;} .geo-load{color:#888;} .geo-hint{color:#bbb;font-size:10px;}
.sr-list,.ci-results{margin-top:6px;}
.sr-btn{display:block;width:100%;text-align:left;padding:10px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--sf);font-size:13px;cursor:pointer;margin-bottom:5px;font-family:inherit;}
.sr-btn:hover,.sr-btn:active{background:#f0f4ff;border-color:#b5d4f4;}
.sr-name{font-weight:700;} .sr-addr{font-size:12px;color:#888;margin-top:2px;}
.fr{display:flex;gap:8px;}
.fr .ff{flex:1;}
.ma{display:flex;gap:8px;margin-top:14px;}
.ma button{flex:1;padding:13px;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.ma button:disabled{opacity:.45;}
.bc{background:var(--bg);color:#1a1a1a;}
.bs{background:#1a1a1a;color:#fff;}
.bd{background:#ff3830;color:#fff;}
.tog{width:36px;height:20px;background:#d8d5ce;border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tog.on{background:#30a46c;}
.tog::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tog.on::after{transform:translateX(16px);}
.trow{display:flex;align-items:center;gap:8px;}
.tlbl{font-size:13px;color:#888;}
.hint{font-size:10px;color:#ccc;text-align:right;margin-top:7px;}
/* Priority buttons */
.prow{display:flex;gap:6px;flex-wrap:wrap;}
.pbtn{padding:8px 12px;border-radius:8px;border:2.5px solid transparent;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;opacity:.55;transition:all .15s;}
.pbtn.on{opacity:1;border-color:rgba(0,0,0,.2);}
</style>
</head>
<body>

<!-- Header -->
<div id="hdr">
  <h1>✈️ 도쿄 Jun 6–8, 2026</h1>
  <div id="sync" class="ok"><div class="dot"></div><span id="stxt">동기화됨</span></div>
</div>

<!-- Tab bar -->
<div id="tabs">
  <button class="tab-btn on" id="t-plan" onclick="showTab('plan')">📅 일정</button>
  <button class="tab-btn" id="t-sat" onclick="showTab('sat')">🗓 토요일</button>
</div>

<!-- Content area -->
<div id="ca">

  <!-- ══ Planner panel ══ -->
  <div class="panel on" id="pp">
    <!-- planner sub-header -->
    <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div id="pp-hdr">
        <span style="font-size:12px;font-weight:700;color:#888;flex:1;">전체 일정</span>
        <button class="hbtn hbtn-l" onclick="openWM()">+ 위시리스트</button>
        <button class="hbtn hbtn-d" onclick="openEM(null)">+ 일정 추가</button>
      </div>
      <div id="pi">
        <div id="cal">
          <div class="dhr">
            <div class="tgs"></div>
            <div class="dh dh0">6월 6일 (토)</div>
            <div class="dh dh1">6월 7일 (일)</div>
            <div class="dh dh2">6월 8일 (월)</div>
          </div>
          <div id="csc"><div id="cgd"><div id="tg"></div><div class="dcol" id="dc0"></div><div class="dcol" id="dc1"></div><div class="dcol" id="dc2"></div></div></div>
        </div>
        <div id="sb">
          <div id="sbt" onclick="toggleSB()"><span id="sbc">◀</span><span id="sbtl">위시리스트 &amp; 지도</span></div>
          <div id="wp">
            <div class="wphdr"><span class="wptitle">📋 위시리스트</span><button class="hbtn hbtn-l" onclick="openWM()" style="padding:3px 8px;font-size:11px;border-radius:5px;">+ 추가</button></div>
            <div id="witems"></div>
            <button class="wadd" onclick="openWM()">+ 항목 추가</button>
          </div>
          <div id="pmp">
            <div id="mf"></div>
            <button class="gmbtn" onclick="openGM()">🗺 Google Maps</button>
            <div id="pmap"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ Saturday panel ══ -->
  <div class="panel" id="sp">
    <div id="sat">

      <!-- 액션 버튼 -->
      <div class="act-row">
        <button class="act-btn act-add" onclick="openCI(null)">+ 장소 추가</button>
        <button class="act-btn act-calc" onclick="calcRoutes()">🔄 동선 계산</button>
      </div>

      <!-- 체크리스트 -->
      <div class="sec">
        <div class="sec-hdr">
          <div>
            <div class="sec-title">체크리스트</div>
            <div class="sec-sub">탭하여 수정 · 체크박스로 완료</div>
          </div>
        </div>
        <div id="ci-list"></div>
      </div>

      <!-- 최적 동선 결과 -->
      <div id="rtsec">
        <div class="sec-hdr"><div class="sec-title">최적 동선</div></div>
        <div class="rt-tabs">
          <button class="rtbtn on" onclick="showRoute(0)">1안 · 동선</button>
          <button class="rtbtn" onclick="showRoute(1)">2안 · 균형</button>
          <button class="rtbtn" onclick="showRoute(2)">3안 · 우선순위</button>
        </div>
        <div id="rt-card-area"></div>
      </div>

      <!-- 지도 (하단) -->
      <div class="sec">
        <div class="sec-hdr"><div class="sec-title">지도</div></div>
        <div class="sat-map-wrap"><div id="smap"></div></div>
      </div>

    </div>
  </div>
</div>

<!-- ══ Planner: Event Modal ══ -->
<div class="mo center" id="emd">
  <div class="msheet box">
    <h3 id="emtit">일정 추가</h3>
    <div class="ff"><label>이름</label><input type="text" id="en" autocomplete="off" placeholder="예: 도쿄 타워"/></div>
    <div class="ff"><label>날짜</label><select id="ed"><option value="0">6월 6일 (토)</option><option value="1">6월 7일 (일)</option><option value="2">6월 8일 (월)</option></select></div>
    <div class="fr"><div class="ff"><label>시작</label><input type="time" id="es" value="12:00"/></div><div class="ff"><label>종료</label><input type="time" id="ee" value="13:00"/></div></div>
    <div class="ff">
      <label>장소 <span style="font-weight:400;color:#bbb;">— 검색 후 선택</span></label>
      <div class="loc-row"><input type="text" id="el" autocomplete="off" placeholder="장소명, 역 이름 등"/><button class="geo-btn" id="geobtn" onclick="doGeo()">🔍</button></div>
      <div class="geo-st" id="geost"><span class="geo-hint">한국어·일본어·영어 모두 가능</span></div>
      <div class="sr-list" id="ev-res"></div>
    </div>
    <div class="ff"><label>메모 <span style="font-weight:400;color:#bbb;">Shift+Enter 줄바꿈</span></label><textarea id="ememo" rows="1" autocomplete="off" placeholder="예: 예약 필수, 메모 등"></textarea></div>
    <div class="ff"><div class="trow"><div class="tog on" id="etog"></div><span class="tlbl" id="etlbl">고정 일정</span></div></div>
    <div class="ma">
      <button class="bc" onclick="closeEM()">취소</button>
      <button class="bd" id="edel" onclick="delEv()" style="display:none;flex:.7;">삭제</button>
      <button class="bs" id="esave" onclick="saveEv()">저장</button>
    </div>
    <div class="hint">Enter 저장 · Esc 닫기</div>
  </div>
</div>

<!-- ══ Planner: Wish Modal ══ -->
<div class="mo center" id="wmd">
  <div class="msheet box" style="width:340px;">
    <h3>위시리스트 추가</h3>
    <div class="ff"><label>이름</label><input type="text" id="wn" autocomplete="off" placeholder="가고 싶은 곳 / 하고 싶은 것"/></div>
    <div class="ff"><label>메모 (선택)</label><input type="text" id="wmemo" autocomplete="off" placeholder="예: 지유가오카 카페거리"/></div>
    <div class="ma">
      <button class="bc" onclick="closeWM()">취소</button>
      <button class="bs" onclick="saveW()">추가</button>
    </div>
    <div class="hint">Enter 추가 · Esc 닫기</div>
  </div>
</div>

<!-- ══ Saturday: Checklist item Modal (bottom sheet) ══ -->
<div class="mo" id="cimd">
  <div class="msheet">
    <h3 id="citit">장소 추가</h3>
    <div class="ff"><label>이름</label><input type="text" id="cin" autocomplete="off" placeholder="가게, 장소, 할 것 등"/></div>
    <div class="ff">
      <label>우선순위</label>
      <div class="prow" id="prow">
        <button class="pbtn" data-p="1" style="background:#e53935;" onclick="selP(1)">1순위</button>

/* ── Google Maps ── */
function loadGMaps(){

window.onGMReady=function(){console.log('Google Maps 준비');};
function getPlacePreds(q,cb){
  if(!window.google){cb([]);return;}
  new google.maps.places.AutocompleteService().getPlacePredictions({input:q,language:'ko'},function(p,s){cb(s==='OK'&&p?p.slice(0,3):[]);});
}
function getPlaceDet(pid,cb){
  if(!window.google){cb(null);return;}
  new google.maps.places.PlacesService(document.createElement('div')).getDetails(
    {placeId:pid,fields:['name','geometry','formatted_address']},
    function(p,s){cb(s==='OK'&&p&&p.geometry?{name:p.name,addr:p.formatted_address,lat:p.geometry.location.lat(),lng:p.geometry.location.lng()}:null);});
}
async function geocodeREST(q){
  try{
    var ct=new AbortController();setTimeout(function(){ct.abort();},5000);
    var r=await fetch('https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(q)+'&key='+APIKEY+'&language=ko',{signal:ct.signal});
    var d=await r.json();
    if(d.status==='OK'){var l=d.results[0].geometry.location;return{lat:l.lat,lng:l.lng,name:(d.results[0].formatted_address||'').split(',')[0]};}
  }catch(e){}return null;
}
function buildSearchResults(container,pendRef,geoStId,locInputId,mapFly){
  var loc=document.getElementById(locInputId).value.trim();
  if(!loc){document.getElementById(geoStId).innerHTML='<span class="geo-fail">장소명을 입력해주세요</span>';return;}
  var btn=container.previousElementSibling.querySelector('.geo-btn')||document.getElementById(locInputId==='el'?'geobtn':'cigeobtn');
  btn.disabled=true;btn.textContent='...';
  document.getElementById(geoStId).innerHTML='<span class="geo-load">검색 중...</span>';
  var resDiv=locInputId==='el'?document.getElementById('ev-res'):document.getElementById('ci-res');
  resDiv.innerHTML='';
  getPlacePreds(loc,function(preds){
    btn.disabled=false;btn.textContent='🔍';
    if(preds.length){
      document.getElementById(geoStId).innerHTML='<span class="geo-hint">아래에서 선택해주세요</span>';
      preds.forEach(function(pred){
        var b=document.createElement('button');b.className='sr-btn';
        var m=pred.structured_formatting;
        b.innerHTML='<div class="sr-name">'+(m&&m.main_text?m.main_text:pred.description)+'</div>'+(m&&m.secondary_text?'<div class="sr-addr">'+m.secondary_text+'</div>':'');
        b.onclick=function(){
          resDiv.innerHTML='<span class="geo-load" style="font-size:11px;color:#888;">좌표 가져오는 중...</span>';
          getPlaceDet(pred.place_id,function(det){
            if(det){
              document.getElementById(locInputId).value=det.name;
              pendRef.lat=det.lat;pendRef.lng=det.lng;
              document.getElementById(geoStId).innerHTML='<span class="geo-ok">✓ '+det.name+'</span>';
              resDiv.innerHTML='';
              if(mapFly)mapFly(det.lat,det.lng);
            }else{resDiv.innerHTML='<span style="font-size:11px;color:#cc3030;">⚠ 좌표를 가져올 수 없어요</span>';}
          });
        };
        resDiv.appendChild(b);
      });
    }else{
      geocodeREST(loc).then(function(r){
        if(r){pendRef.lat=r.lat;pendRef.lng=r.lng;document.getElementById(geoStId).innerHTML='<span class="geo-ok">✓ '+r.name+'</span>';if(mapFly)mapFly(r.lat,r.lng);}
        else{document.getElementById(geoStId).innerHTML='<span class="geo-fail">⚠ 찾을 수 없어요</span>';}
      });
    }
  });
}

/* ── Render Planner ── */
function renderCal(){
  var tg=document.getElementById('tg');
  tg.style.cssText='width:50px;flex-shrink:0;position:relative;height:'+TH+'px;pointer-events:none;';
  tg.innerHTML='';
  for(var h=SH;h<=EH;h++){var el=document.createElement('div');el.className='tgl';el.style.top=(h-SH)*60*PPM+'px';el.textContent=(h<10?'0':'')+h+':00';tg.appendChild(el);}
  for(var d=0;d<3;d++){(function(day){
    var col=document.getElementById('dc'+day);
    col.style.cssText='flex:1;position:relative;border-left:1px solid var(--bd);cursor:crosshair;height:'+TH+'px;';
    col.innerHTML='';
    for(var h2=SH;h2<=EH;h2++){var y=(h2-SH)*60*PPM;var ln=document.createElement('div');ln.className='hl';ln.style.top=y+'px';col.appendChild(ln);if(h2<EH){var hl=document.createElement('div');hl.className='hl hlh';hl.style.top=(y+30*PPM)+'px';col.appendChild(hl);}}
    S.events.filter(function(e){return e.day===day;}).forEach(function(ev){
      var sm=t2m(ev.start),em=t2m(ev.end),top=m2y(sm),ht=Math.max((em-sm)*PPM,20);
      var c=DC[day],bg=ev.fixed?c.hi:c.lo,tc=ev.fixed?c.th:c.tl;
      var b=document.createElement('button');b.className='eblk';
      b.style.cssText='top:'+top+'px;height:'+ht+'px;background:'+bg+';color:'+tc+';';
      b.innerHTML='<div class="eblk-t">'+ev.title+'</div><div class="eblk-tm">'+ev.start+'–'+ev.end+'</div>'+(ev.loc?'<div class="eblk-l">📍 '+ev.loc+'</div>':'')+(ev.memo?'<div class="eblk-memo">'+ev.memo+'</div>':'')+'<div class="eblk-b">'+(ev.fixed?'고정':'가변')+'</div>';
      b.onclick=(function(id){return function(e){e.stopPropagation();openEM(id);};})(ev.id);
      col.appendChild(b);
    });
    col.ondragover=function(e){e.preventDefault();col.classList.add('dov');};
    col.ondragleave=function(){col.classList.remove('dov');};
    col.ondrop=function(e){e.preventDefault();col.classList.remove('dov');if(!dwid)return;var rect=col.getBoundingClientRect();var sm2=Math.round(y2m(e.clientY-rect.top)/15)*15;dropW(dwid,day,Math.max(SH*60,Math.min(sm2,(EH-1)*60)));dwid=null;};
    col.onclick=function(e){if(e.target!==col)return;var rect=col.getBoundingClientRect();var sm3=Math.round(y2m(e.clientY-rect.top)/15)*15;openEM(null,day,m2t(Math.max(SH*60,Math.min(sm3,(EH-1)*60))));};
  })(d);}
}
function renderWish(){
  var c=document.getElementById('witems');c.innerHTML='';
  if(!S.wishlist||!S.wishlist.length){c.innerHTML='<div class="wempty">아직 없어요 🌟<br>추가 후 드래그해서<br>일정에 넣어보세요</div>';return;}

    el.innerHTML='<div class="wt">'+w.title+'</div>'+(w.memo?'<div class="wl">'+w.memo+'</div>':'')+'<button class="wdel" onclick="delW(\''+w.id+'\')">×</button>';
    el.ondragstart=function(){dwid=w.id;el.classList.add('dg');};el.ondragend=function(){el.classList.remove('dg');};

function initPMap(){
  try{
    pMap=L.map('pmap').setView([35.685,139.710],12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(pMap);
    L.control.zoom({position:'bottomright'}).addTo(pMap);
    renderMF();updatePMap();
    if(window.ResizeObserver)new ResizeObserver(function(){if(pMap)pMap.invalidateSize();}).observe(document.getElementById('pmap'));
  }catch(e){console.error(e);}
}
function renderMF(){
  var c=document.getElementById('mf');c.innerHTML='';
  ['6/6','6/7','6/8'].forEach(function(lb,i){
    var b=document.createElement('button');b.className='mfb'+(mfa[i]?'':' off');b.style.background=DC[i].hi;b.style.color=DC[i].th;b.textContent=lb;
    b.onclick=(function(idx){return function(){mfa[idx]=!mfa[idx];renderMF();updatePMap();};})(i);
    c.appendChild(b);
  });
}
function updatePMap(){
  if(!pMap)return;
  pmk.forEach(function(m){pMap.removeLayer(m);});pmk=[];
  prls.forEach(function(l){pMap.removeLayer(l);});prls=[];
  for(var d=0;d<3;d++){
    if(!mfa[d])continue;
    var evts=S.events.filter(function(e){return e.day===d&&e.lat&&e.lng;}).sort(function(a,b){return t2m(a.start)-t2m(b.start);});
    for(var i=0;i<evts.length-1;i++){
      var p1=[evts[i].lat,evts[i].lng],p2=[evts[i+1].lat,evts[i+1].lng];
      var dl=p2[0]-p1[0],dn=p2[1]-p1[1];if(Math.abs(dl)<1e-6&&Math.abs(dn)<1e-6)continue;
      prls.push(L.polyline([p1,p2],{color:DC[d].hi,weight:2.5,opacity:.65,dashArray:'8,5'}).addTo(pMap));
      var ang=Math.atan2(dn,dl)*180/Math.PI;
      var ai=L.divIcon({html:'<svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate('+ang+'deg);transform-origin:8px 8px;display:block;"><polygon points="8,1 15,15 8,11 1,15" fill="'+DC[d].hi+'" opacity="0.9"/></svg>',className:'',iconSize:[16,16],iconAnchor:[8,8]});
      prls.push(L.marker([p1[0]+dl*0.6,p1[1]+dn*0.6],{icon:ai,interactive:false}).addTo(pMap));
    }
  }
  S.events.forEach(function(ev){
    if(!ev.lat||!ev.lng||!mfa[ev.day])return;
    var sorted=S.events.filter(function(e){return e.day===ev.day&&e.lat&&e.lng;}).sort(function(a,b){return t2m(a.start)-t2m(b.start);});
    var ord=0;for(var i=0;i<sorted.length;i++){if(sorted[i].id===ev.id){ord=i+1;break;}}
    var c=DC[ev.day].hi;
    var pi=L.divIcon({html:'<div style="width:26px;height:26px;background:'+c+';border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;font-family:sans-serif;">'+ord+'</span></div>',className:'',iconSize:[26,26],iconAnchor:[13,26]});
    var m=L.marker([ev.lat,ev.lng],{icon:pi}).addTo(pMap);
    m.bindPopup('<b>'+ev.title+'</b><br><small>'+ev.start+'–'+ev.end+'</small>'+(ev.loc?'<br>📍 '+ev.loc:'')+(ev.memo?'<br>'+ev.memo:''));
    pmk.push(m);
  });
}
function openGM(){
  var ad=mfa.findIndex(function(f){return f;});if(ad===-1)return;
  var evts=S.events.filter(function(e){return e.day===ad&&e.loc;}).sort(function(a,b){return t2m(a.start)-t2m(b.start);});
  if(evts.length<2){alert('같은 날 장소가 2개 이상 있어야 해요');return;}
  window.open('https://www.google.com/maps/dir/'+evts.map(function(e){return encodeURIComponent(e.loc);}).join('/'),'_blank');
}

function openEM(id,pd,pt){
  eid=id||null;pendEv={lat:null,lng:null};resetEM();

    document.getElementById('el').value=ev.loc||'';document.getElementById('ememo').value=ev.memo||'';autoResM();

    document.getElementById('el').value='';document.getElementById('ememo').value='';document.getElementById('ememo').style.height='40px';
    setTog(true);document.getElementById('edel').style.display='none';

  document.getElementById('emd').classList.add('on');setTimeout(function(){document.getElementById('en').focus();},100);
}
function closeEM(){document.getElementById('emd').classList.remove('on');eid=null;pendEv=null;resetEM();}
async function saveEv(){
  var name=document.getElementById('en').value.trim();if(!name){document.getElementById('en').focus();return;}

    c.appendChild(el);
  });
}
function toggleCI(id){

/* ── Saturday: Map ── */
function initSMap(){
  try{
    sMap=L.map('smap').setView([35.728,139.710],14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(sMap);
    L.control.zoom({position:'bottomright'}).addTo(sMap);
    updateSMap();
    if(window.ResizeObserver)new ResizeObserver(function(){if(sMap)sMap.invalidateSize();}).observe(document.getElementById('smap'));
  }catch(e){console.error(e);}
}
function updateSMap(){
  if(!sMap)return;
  smk.forEach(function(m){sMap.removeLayer(m);});smk=[];
  srls.forEach(function(l){sMap.removeLayer(l);});srls=[];
  // Draw current route if available
  if(routeOpts.length&&routeOpts[curRoute]){
    var path=routeOpts[curRoute].path;
    for(var i=0;i<path.length-1;i++){
      var p1=[path[i].lat,path[i].lng],p2=[path[i+1].lat,path[i+1].lng];
      srls.push(L.polyline([p1,p2],{color:'#333',weight:2.5,opacity:.5,dashArray:'6,4'}).addTo(sMap));
    }
  }
  // Draw pins (colored by priority)
  SAT.forEach(function(ci){
    if(!ci.lat||!ci.lng)return;
    var pc=getPCol(ci.priority||1);
    var pi=L.divIcon({html:'<div style="width:26px;height:26px;background:'+pc+';border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);color:#fff;font-size:10px;font-weight:700;font-family:sans-serif;">'+(ci.priority||1)+'</span></div>',className:'',iconSize:[26,26],iconAnchor:[13,26]});
    var m=L.marker([ci.lat,ci.lng],{icon:pi}).addTo(sMap);
    m.bindPopup('<b>'+ci.title+'</b>'+(ci.loc?'<br>📍 '+ci.loc:'')+(ci.memo?'<br>'+ci.memo:''));
    smk.push(m);
  });
}

/* ── Saturday: Route optimization ── */
function haversine(a,b){
  var R=6371,d2r=Math.PI/180,dLat=(b.lat-a.lat)*d2r,dLng=(b.lng-a.lng)*d2r;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*d2r)*Math.cos(b.lat*d2r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function nnTSP(pts,costFn){
  if(!pts.length)return[];
  var rem=pts.slice(),path=[],cur=rem.splice(0,1)[0];path.push(cur);
  while(rem.length){var bi=-1,bc=Infinity;for(var i=0;i<rem.length;i++){var c=costFn(cur,rem[i]);if(c<bc){bc=c;bi=i;}}cur=rem.splice(bi,1)[0];path.push(cur);}
  return path;
}
function totalKm(path){var t=0;for(var i=0;i<path.length-1;i++)t+=haversine(path[i],path[i+1]);return t;}
function calcRoutes(){
  var items=SAT.filter(function(c){return c.lat&&c.lng&&!c.done;});
  if(items.length<2){alert('위치가 설정된 미완료 항목이 2개 이상 있어야 해요\n(항목 추가 시 🔍로 위치를 검색해주세요)');return;}
  // 1안: 동선 최우선
  var opt1=nnTSP(items.slice(),function(a,b){return haversine(a,b);});
  // 2안: 균형 (거리 + 우선순위 가중치)
  var opt2=nnTSP(items.slice(),function(a,b){return haversine(a,b)*(1+(b.priority-1)*0.4);});
  // 3안: 우선순위 최우선 (우선순위 그룹별 NN)
  var groups={},gkeys=[];
  items.forEach(function(ci){var p=ci.priority||1;if(!groups[p]){groups[p]=[];gkeys.push(p);}groups[p].push(ci);});
  gkeys.sort(function(a,b){return a-b;});
  var opt3=[];
  gkeys.forEach(function(p){
    var g=groups[p];
    if(g.length===1){opt3.push(g[0]);return;}
    // Start from closest to last point in opt3 if available
    var startIdx=0;
    if(opt3.length){var last=opt3[opt3.length-1];var bd=Infinity;g.forEach(function(ci,i){var d=haversine(last,ci);if(d<bd){bd=d;startIdx=i;}});}
    var gRem=g.slice();var first=gRem.splice(startIdx,1)[0];opt3.push(first);
    while(gRem.length){var cur=opt3[opt3.length-1],bi=-1,bc=Infinity;gRem.forEach(function(ci,i){var d=haversine(cur,ci);if(d<bc){bc=d;bi=i;}});opt3.push(gRem.splice(bi,1)[0]);}
  });
  var km=function(path){return totalKm(path).toFixed(1)+'km';};
  routeOpts=[
    {label:'동선 최우선',desc:'최단 이동 거리',path:opt1,km:km(opt1)},
    {label:'균형',desc:'거리·우선순위 절충',path:opt2,km:km(opt2)},
    {label:'우선순위 최우선',desc:'1순위부터 순서대로',path:opt3,km:km(opt3)}
  ];
  curRoute=0;
  document.getElementById('rtsec').style.display='block';
  document.querySelectorAll('.rtbtn').forEach(function(b,i){b.classList.toggle('on',i===0);});
  showRoute(0);
}
function showRoute(idx){
  curRoute=idx;
  document.querySelectorAll('.rtbtn').forEach(function(b,i){b.classList.toggle('on',i===idx);});
  if(!routeOpts[idx])return;
  var opt=routeOpts[idx];
  var path=opt.path;
  // Build path display
  var pathHtml='';
  path.forEach(function(ci,i){
    var pc=getPCol(ci.priority||1);
    if(i>0)pathHtml+='<span class="rparr">→</span>';
    pathHtml+='<span class="rpi"><span class="rpi-n">'+(i+1)+'</span><span class="rpi-dot" style="background:'+pc+';"></span>'+ci.title+'</span>';
  });
  document.getElementById('rt-card-area').innerHTML='<div class="rt-card"><div class="rt-meta"><span class="rt-lbl">'+opt.label+'</span><span class="rt-km">이동 '+opt.km+'</span></div><div class="rt-path">'+pathHtml+'</div><button class="rt-open" onclick="openRouteGM('+idx+')">Google Maps에서 경로 보기</button></div>';
  updateSMap();
}
function openRouteGM(idx){
  if(!routeOpts[idx])return;
  var stops=routeOpts[idx].path.map(function(ci){return encodeURIComponent(ci.loc||(ci.lat+','+ci.lng));});
  window.open('https://www.google.com/maps/dir/'+stops.join('/'),'_blank');
}
