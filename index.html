<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>✈️ 도쿄 여행 플래너 Jun 6–8</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:14px;color:#1a1a1a;background:#f4f2ef;display:flex;flex-direction:column;}
:root{
  --d0-hi:#993556;--d0-lo:#F4C0D1;--d0-bg:#FBEAF0;--d0-th:#FBEAF0;--d0-tl:#72243E;
  --d1-hi:#854F0B;--d1-lo:#FAC775;--d1-bg:#FAEEDA;--d1-th:#FAEEDA;--d1-tl:#633806;
  --d2-hi:#185FA5;--d2-lo:#B5D4F4;--d2-bg:#E6F1FB;--d2-th:#E6F1FB;--d2-tl:#0C447C;
}
/* Google Autocomplete 드롭다운이 모달 위에 뜨도록 */
.pac-container{z-index:10000!important;font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:13px;}

#hdr{background:#fff;border-bottom:1px solid #e5e3de;padding:0 18px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#hdr h1{font-size:15px;font-weight:700;flex:1;}
#sync{font-size:11px;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;transition:all .3s;}
#sync.ok{background:#e6f9f0;color:#1a7a4a;}
#sync.saving{background:#f0f0f0;color:#666;}
#sync.err{background:#fff0f0;color:#cc3030;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.hbtn{padding:6px 14px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.hbtn:hover{opacity:.8;}
.hbtn-light{background:#f4f2ef;color:#1a1a1a;}
.hbtn-dark{background:#1a1a1a;color:#fff;}
#main{display:flex;flex:1;overflow:hidden;}
#cal{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-right:1px solid #e5e3de;min-width:0;}
.dhr{display:flex;flex-shrink:0;border-bottom:1px solid #e5e3de;}
.tgs{width:52px;flex-shrink:0;}
.dh{flex:1;padding:9px 10px;font-size:12px;font-weight:700;text-align:center;border-left:1px solid #e5e3de;}
.dh0{background:var(--d0-bg);color:var(--d0-hi);}
.dh1{background:var(--d1-bg);color:var(--d1-hi);}
.dh2{background:var(--d2-bg);color:var(--d2-hi);}
#csc{overflow-y:auto;flex:1;}
#cgd{display:flex;}
#tg{width:52px;flex-shrink:0;position:relative;pointer-events:none;}
.tgl{position:absolute;right:7px;font-size:11px;color:#aaa;transform:translateY(-50%);white-space:nowrap;}
.dcol{flex:1;position:relative;border-left:1px solid #e5e3de;cursor:crosshair;}
.dcol.dov{background:rgba(0,0,0,.04);}
.hl{position:absolute;left:0;right:0;border-top:1px solid #f0eeea;pointer-events:none;}
.hlh{border-top-style:dashed;opacity:.5;}
.eblk{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer;overflow:hidden;border:none;text-align:left;z-index:5;transition:filter .1s,transform .1s;}
.eblk:hover{filter:brightness(1.07);transform:translateY(-1px);}
.eblk-t{font-weight:700;line-height:1.3;}
.eblk-tm{font-size:10px;opacity:.82;margin-top:2px;}
.eblk-l{font-size:10px;opacity:.68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.eblk-b{position:absolute;top:4px;right:6px;font-size:9px;font-weight:700;opacity:.7;}
#sb{width:270px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;background:#f4f2ef;border-left:1px solid #e5e3de;transition:width .28s cubic-bezier(.4,0,.2,1);}
#sb.collapsed{width:36px;}
#sb-tab{display:flex;align-items:center;gap:8px;padding:10px 10px;background:#eae8e4;border-bottom:1px solid #d8d5ce;cursor:pointer;flex-shrink:0;white-space:nowrap;user-select:none;}
#sb-tab:hover{background:#dedad4;}
#sb-chev{font-size:14px;flex-shrink:0;transition:transform .28s;color:#555;line-height:1;}
#sb.collapsed #sb-chev{transform:rotate(180deg);}
#sb-tab-lbl{font-size:12px;font-weight:700;color:#666;}
#wp{flex:1;overflow-y:auto;padding:13px;border-bottom:1px solid #e5e3de;}
.wphdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.wptitle{font-size:11px;font-weight:700;color:#888;letter-spacing:.5px;text-transform:uppercase;}
.witem{background:#fff;border:1.5px dashed #d8d5ce;border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:6px;cursor:grab;position:relative;user-select:none;transition:box-shadow .12s;}
.witem:hover{box-shadow:0 2px 8px rgba(0,0,0,.09);}
.witem.dragging{opacity:.35;cursor:grabbing;}
.witem-geo{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d8d5ce;margin-left:5px;vertical-align:middle;flex-shrink:0;}
.witem-geo.has{background:#30a46c;}
.wt{font-weight:700;color:#666;margin-right:20px;display:flex;align-items:center;gap:4px;}
.wl{font-size:11px;color:#999;margin-top:3px;}
.wdel{position:absolute;top:7px;right:8px;background:none;border:none;font-size:16px;color:#ccc;cursor:pointer;line-height:1;padding:0;}
.wdel:hover{color:#999;}
.wadd{width:100%;padding:8px;border:1.5px dashed #d8d5ce;border-radius:9px;background:transparent;font-size:12px;color:#999;cursor:pointer;margin-top:3px;font-family:inherit;}
.wadd:hover{background:#fff;}
.wempty{text-align:center;font-size:11px;color:#bbb;padding:20px 8px;line-height:2;}
#mp{height:280px;flex-shrink:0;position:relative;}
#map{height:100%;width:100%;}
#mf{position:absolute;top:7px;left:7px;z-index:1000;display:flex;gap:4px;}
.mfb{padding:3px 9px;border-radius:20px;border:none;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.mfb.off{opacity:.28;}
.gmbtn{position:absolute;bottom:7px;right:7px;z-index:1000;padding:4px 10px;background:#fff;border:1px solid #ddd;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:#1a73e8;box-shadow:0 1px 4px rgba(0,0,0,.15);}
.gmbtn:hover{background:#f0f4ff;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.mo.open{display:flex;}
.mb{background:#fff;border-radius:16px;padding:24px;width:380px;max-width:92vw;box-shadow:0 24px 64px rgba(0,0,0,.18);}
.mb h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.ff{margin-bottom:11px;}
.ff label{display:block;font-size:11px;font-weight:700;color:#888;margin-bottom:4px;letter-spacing:.3px;}
.ff input,.ff select{width:100%;padding:8px 11px;border:1.5px solid #e5e3de;border-radius:8px;font-size:13px;outline:none;font-family:inherit;transition:border-color .15s;}
.ff input:focus,.ff select:focus{border-color:#1a1a1a;}
.loc-row{display:flex;gap:7px;}
.loc-row input{flex:1;}
.geo-btn{padding:8px 12px;border:1.5px solid #e5e3de;border-radius:8px;background:#f4f2ef;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.geo-btn:hover:not(:disabled){background:#eae8e4;}
.geo-st{font-size:11px;margin-top:5px;min-height:16px;line-height:1.5;}
.geo-ok{color:#1a7a4a;}
.geo-fail{color:#cc3030;}
.geo-loading{color:#888;}
.geo-hint{color:#bbb;font-size:10px;}
.fr{display:flex;gap:9px;}
.fr .ff{flex:1;}
.ma{display:flex;gap:8px;margin-top:16px;}
.ma button{flex:1;padding:10px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.ma button:hover:not(:disabled){opacity:.85;}
.ma button:disabled{opacity:.45;cursor:not-allowed;}
.bc{background:#f4f2ef;color:#1a1a1a;}
.bs{background:#1a1a1a;color:#fff;}
.bd{background:#ff3830;color:#fff;}
.tog{width:36px;height:20px;background:#d8d5ce;border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tog.on{background:#30a46c;}
.tog::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tog.on::after{transform:translateX(16px);}
.trow{display:flex;align-items:center;gap:9px;}
.tlbl{font-size:12px;color:#888;}
</style>
</head>
<body>

<div id="hdr">
  <h1>✈️ 도쿄 여행 플래너 · Jun 6–8, 2026</h1>
  <div id="sync" class="ok"><div class="dot"></div><span id="stxt">동기화됨</span></div>
  <button class="hbtn hbtn-light" onclick="openWM()">+ 위시리스트</button>
  <button class="hbtn hbtn-dark" onclick="openEM(null)">+ 일정 추가</button>
</div>

<div id="main">
  <div id="cal">
    <div class="dhr">
      <div class="tgs"></div>
      <div class="dh dh0">6월 6일 (토)</div>
      <div class="dh dh1">6월 7일 (일)</div>
      <div class="dh dh2">6월 8일 (월)</div>
    </div>
    <div id="csc">
      <div id="cgd">
        <div id="tg"></div>
        <div class="dcol" id="dc0" data-day="0"></div>
        <div class="dcol" id="dc1" data-day="1"></div>
        <div class="dcol" id="dc2" data-day="2"></div>
      </div>
    </div>
  </div>

  <div id="sb">
    <div id="sb-tab" onclick="toggleSB()" title="패널 열기/접기">
      <span id="sb-chev">◀</span>
      <span id="sb-tab-lbl">위시리스트 &amp; 지도</span>
    </div>
    <div id="wp">
      <div class="wphdr">
        <span class="wptitle">📋 위시리스트</span>
        <button class="hbtn hbtn-light" onclick="openWM()" style="padding:3px 9px;font-size:11px;border-radius:6px;">+ 추가</button>
      </div>
      <div id="witems"></div>
      <button class="wadd" onclick="openWM()">+ 항목 추가</button>
    </div>
    <div id="mp">
      <div id="mf"></div>
      <button class="gmbtn" onclick="openGoogleMaps()">🗺 Google Maps 경로</button>
      <div id="map"></div>
    </div>
  </div>
</div>

<!-- Event Modal -->
<div class="mo" id="emd">
  <div class="mb">
    <h3 id="emtitle">일정 추가</h3>
    <div class="ff"><label>이름</label><input type="text" id="en" placeholder="예: 도쿄 타워 방문" autocomplete="off"/></div>
    <div class="ff"><label>날짜</label><select id="ed"><option value="0">6월 6일 (토)</option><option value="1">6월 7일 (일)</option><option value="2">6월 8일 (월)</option></select></div>
    <div class="fr">
      <div class="ff"><label>시작</label><input type="time" id="es" value="12:00"/></div>
      <div class="ff"><label>종료</label><input type="time" id="ee" value="13:00"/></div>
    </div>
    <div class="ff">
      <label>장소 <span style="font-weight:400;color:#bbb;">(입력하면 자동완성 제안)</span></label>
      <div class="loc-row">
        <input type="text" id="el" placeholder="장소명, 주소, 가게 이름 등" autocomplete="off"/>
        <button class="geo-btn" id="geobtn" onclick="doGeocode()">🔍</button>
      </div>
      <div class="geo-st" id="geost"><span class="geo-hint">한국어·일본어·영어 모두 검색 가능</span></div>
    </div>
    <div class="ff"><div class="trow"><div class="tog on" id="etog"></div><span class="tlbl" id="etlbl">고정 일정</span></div></div>
    <div class="ma">
      <button class="bc" onclick="closeEM()">취소</button>
      <button class="bd" id="edelbtn" onclick="delEv()" style="display:none;flex:.7;">삭제</button>
      <button class="bs" id="savebtn" onclick="saveEv()">저장</button>
    </div>
  </div>
</div>

<!-- Wish Modal -->
<div class="mo" id="wmd">
  <div class="mb" style="width:360px;">
    <h3>위시리스트 추가</h3>
    <div class="ff"><label>이름</label><input type="text" id="wn" placeholder="가고 싶은 곳 / 하고 싶은 것" autocomplete="off"/></div>
    <div class="ff">
      <label>장소 <span style="font-weight:400;color:#bbb;">(선택 — 자동완성 제안)</span></label>
      <input type="text" id="wl" placeholder="장소명, 주소 등" autocomplete="off"/>
    </div>
    <div class="ma">
      <button class="bc" onclick="closeWM()">취소</button>
      <button class="bs" id="wsavebtn" onclick="saveW()">추가</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ★ API 키: 아래 한 줄만 교체하면 됩니다 ★
const APIKEY = 'AIzaSyB483Cq3GNvg17n9tWlOz5Jbpd5C8YgDeI';
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const DB='https://tokyo-202606-default-rtdb.asia-southeast1.firebasedatabase.app/planner';
const SH=8,EH=23,PPM=1.2,TH=(EH-SH)*60*PPM;
const DC=[
  {hi:'#993556',lo:'#F4C0D1',th:'#FBEAF0',tl:'#72243E'},
  {hi:'#854F0B',lo:'#FAC775',th:'#FAEEDA',tl:'#633806'},
  {hi:'#185FA5',lo:'#B5D4F4',th:'#E6F1FB',tl:'#0C447C'},
];
const IE=[
  {id:'e1',title:'✈️ 비행기 ICN → NRT',day:0,start:'08:50',end:'11:20',fixed:true,loc:'인천국제공항',lat:37.4491,lng:126.4505},
  {id:'e2',title:'🚄 짐 찾기 + 스카이라이너',day:0,start:'11:50',end:'13:20',fixed:true,loc:'나리타 → 이케부쿠로',lat:35.7295,lng:139.7109},
  {id:'e3',title:'👗 의상샵',day:0,start:'18:00',end:'19:30',fixed:true,loc:'이케부쿠로',lat:35.7296,lng:139.7110},
  {id:'e4',title:'💇 헤어샵',day:1,start:'11:00',end:'12:30',fixed:true,loc:'신주쿠',lat:35.6938,lng:139.7034},
  {id:'e5',title:'💒 결혼식 등록',day:1,start:'13:30',end:'15:00',fixed:true,loc:'신주쿠 결혼식장',lat:35.6895,lng:139.6917},
  {id:'e6',title:'✈️ 비행기 NRT → ICN',day:2,start:'19:55',end:'22:35',fixed:true,loc:'나리타공항',lat:35.7720,lng:140.3929},
];

let S={events:[],wishlist:[]},eid=null,dwid=null;
let lmap=null,mmk=[],routeLayers=[],mfa=[true,true,true];
let sse=null,isMine=false;
let pendingCoords=null,pendingWCoords=null;

const t2m=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const m2t=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const m2y=m=>(m-SH*60)*PPM;
const y2m=y=>Math.round(y/PPM+SH*60);

/* ── Google Maps 로드 ── */
function loadGoogleMaps(){
  const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${APIKEY}&libraries=places&callback=onGoogleReady&language=ko`;
  s.async=true;
  document.head.appendChild(s);
}

// Google Maps API 준비 완료 콜백
window.onGoogleReady=function(){
  // 이벤트 모달 장소 입력에 자동완성
  const evAC=new google.maps.places.Autocomplete(document.getElementById('el'),{
    fields:['name','geometry','formatted_address']
  });
  evAC.addListener('place_changed',()=>{
    const p=evAC.getPlace();
    if(p.geometry?.location){
      pendingCoords={lat:p.geometry.location.lat(),lng:p.geometry.location.lng()};
      const name=p.name||(p.formatted_address||'').split(',')[0];
      document.getElementById('geost').innerHTML=`<span class="geo-ok">✓ ${name}</span>`;
      if(lmap)lmap.flyTo([pendingCoords.lat,pendingCoords.lng],15);
    }
  });

  // 위시리스트 모달 장소 입력에 자동완성
  const wAC=new google.maps.places.Autocomplete(document.getElementById('wl'),{
    fields:['name','geometry','formatted_address']
  });
  wAC.addListener('place_changed',()=>{
    const p=wAC.getPlace();
    if(p.geometry?.location){
      pendingWCoords={lat:p.geometry.location.lat(),lng:p.geometry.location.lng()};
    }
  });
};

/* ── Google Geocoding REST (수동 검색 버튼 / 자동완성 미선택 fallback) ── */
async function geocodeWithGoogle(query){
  try{
    const url=`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(query)}&key=${APIKEY}&language=ko`;
    const r=await fetch(url);
    const d=await r.json();
    if(d.status==='OK'&&d.results.length>0){
      const loc=d.results[0].geometry.location;
      const name=(d.results[0].formatted_address||'').split(',')[0];
      return{lat:loc.lat,lng:loc.lng,name};
    }
  }catch(e){console.warn('geocode error',e);}
  return null;
}

async function doGeocode(){
  const locText=document.getElementById('el').value.trim();
  if(!locText){document.getElementById('geost').innerHTML='<span class="geo-fail">장소명을 먼저 입력해주세요</span>';return;}
  const btn=document.getElementById('geobtn');
  btn.textContent='...';btn.disabled=true;
  document.getElementById('geost').innerHTML='<span class="geo-loading">검색 중...</span>';
  try{
    const result=await geocodeWithGoogle(locText);
    if(result){
      pendingCoords={lat:result.lat,lng:result.lng};
      document.getElementById('geost').innerHTML=`<span class="geo-ok">✓ ${result.name}</span>`;
      if(lmap)lmap.flyTo([pendingCoords.lat,pendingCoords.lng],15);
    }else{
      pendingCoords=null;
      document.getElementById('geost').innerHTML='<span class="geo-fail">⚠ 찾을 수 없어요</span>';
    }
  }finally{btn.textContent='🔍';btn.disabled=false;}
}

/* ── Firebase ── */
function setSS(s){
  const el=document.getElementById('sync');el.className=s;
  document.getElementById('stxt').textContent=s==='ok'?'동기화됨':s==='saving'?'저장 중...':'연결 오류';
}
async function loadDB(){
  try{
    const r=await fetch(`${DB}.json`);const d=await r.json();
    if(d&&d.events)S=d;
    else{S={events:JSON.parse(JSON.stringify(IE)),wishlist:[]};await saveDB();}
  }catch{S={events:JSON.parse(JSON.stringify(IE)),wishlist:[]};setSS('err');}
}
async function saveDB(){
  setSS('saving');isMine=true;
  try{
    await fetch(`${DB}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});
    setSS('ok');
  }catch{setSS('err');}
  setTimeout(()=>{isMine=false;},400);
}
function listenRT(){
  if(sse)sse.close();
  sse=new EventSource(`${DB}.json`);
  sse.addEventListener('put',e=>{
    if(isMine)return;
    try{const msg=JSON.parse(e.data);if(msg.data&&msg.data.events){S=msg.data;render();setSS('ok');}}catch{}
  });
  sse.onerror=()=>{setSS('err');setTimeout(listenRT,5000);};
}

/* ── Sidebar ── */
function toggleSB(){
  const sb=document.getElementById('sb');
  const isCol=sb.classList.toggle('collapsed');
  document.getElementById('sb-chev').textContent=isCol?'▶':'◀';
  if(!isCol&&lmap)setTimeout(()=>lmap.invalidateSize(),300);
}
if(window.innerWidth<700){
  document.getElementById('sb').classList.add('collapsed');
  document.getElementById('sb-chev').textContent='▶';
}

/* ── Calendar ── */
function renderCal(){
  const tg=document.getElementById('tg');
  tg.style.cssText=`width:52px;flex-shrink:0;position:relative;height:${TH}px;pointer-events:none;`;
  tg.innerHTML='';
  for(let h=SH;h<=EH;h++){
    const el=document.createElement('div');el.className='tgl';
    el.style.top=`${(h-SH)*60*PPM}px`;
    el.textContent=`${String(h).padStart(2,'0')}:00`;
    tg.appendChild(el);
  }
  for(let d=0;d<3;d++){
    const col=document.getElementById(`dc${d}`);
    col.style.cssText=`flex:1;position:relative;border-left:1px solid #e5e3de;cursor:crosshair;height:${TH}px;`;
    col.innerHTML='';
    for(let h=SH;h<=EH;h++){
      const y=(h-SH)*60*PPM;
      const ln=document.createElement('div');ln.className='hl';ln.style.top=`${y}px`;col.appendChild(ln);
      if(h<EH){const hl=document.createElement('div');hl.className='hl hlh';hl.style.top=`${y+30*PPM}px`;col.appendChild(hl);}
    }
    S.events.filter(e=>e.day===d).forEach(ev=>{
      const sm=t2m(ev.start),em=t2m(ev.end),top=m2y(sm),ht=Math.max((em-sm)*PPM,22);
      const c=DC[d],bg=ev.fixed?c.hi:c.lo,tc=ev.fixed?c.th:c.tl;
      const b=document.createElement('button');b.className='eblk';
      b.style.cssText=`top:${top}px;height:${ht}px;background:${bg};color:${tc};`;
      b.innerHTML=`<div class="eblk-t">${ev.title}</div><div class="eblk-tm">${ev.start}–${ev.end}</div>${ev.loc?`<div class="eblk-l">📍 ${ev.loc}</div>`:''}<div class="eblk-b">${ev.fixed?'고정':'가변'}</div>`;
      b.onclick=e=>{e.stopPropagation();openEM(ev.id);};
      col.appendChild(b);
    });
    col.ondragover=e=>{e.preventDefault();col.classList.add('dov');};
    col.ondragleave=()=>col.classList.remove('dov');
    col.ondrop=e=>{
      e.preventDefault();col.classList.remove('dov');
      if(!dwid)return;
      const rect=col.getBoundingClientRect();
      const sm=Math.round(y2m(e.clientY-rect.top)/15)*15;
      dropW(dwid,d,Math.max(SH*60,Math.min(sm,(EH-1)*60)));dwid=null;
    };
    col.onclick=e=>{
      if(e.target!==col)return;
      const rect=col.getBoundingClientRect();
      const sm=Math.round(y2m(e.clientY-rect.top)/15)*15;
      openEM(null,d,m2t(Math.max(SH*60,Math.min(sm,(EH-1)*60))));
    };
  }
}

/* ── Wishlist ── */
function renderWish(){
  const c=document.getElementById('witems');c.innerHTML='';
  if(!S.wishlist.length){c.innerHTML='<div class="wempty">아직 없어요 🌟<br>추가 후 드래그해서<br>일정에 넣어보세요</div>';return;}
  S.wishlist.forEach(w=>{
    const el=document.createElement('div');el.className='witem';el.draggable=true;
    const dot=`<span class="witem-geo${w.lat?' has':''}" title="${w.lat?'좌표 있음':'좌표 없음'}"></span>`;
    el.innerHTML=`<div class="wt">${w.title}${dot}</div>${w.loc?`<div class="wl">📍 ${w.loc}</div>`:''}<button class="wdel" onclick="delW('${w.id}')">×</button>`;
    el.ondragstart=()=>{dwid=w.id;el.classList.add('dragging');};
    el.ondragend=()=>el.classList.remove('dragging');
    c.appendChild(el);
  });
}

/* ── Map ── */
function initMap(){
  lmap=L.map('map').setView([35.685,139.710],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(lmap);
  L.control.zoom({position:'bottomright'}).addTo(lmap);
  renderMF();updateMap();
}
function renderMF(){
  const c=document.getElementById('mf');c.innerHTML='';
  ['6/6','6/7','6/8'].forEach((lb,i)=>{
    const b=document.createElement('button');
    b.className='mfb'+(mfa[i]?'':' off');
    b.style.cssText=`background:${DC[i].hi};color:${DC[i].th};`;
    b.textContent=lb;
    b.onclick=()=>{mfa[i]=!mfa[i];renderMF();updateMap();};
    c.appendChild(b);
  });
}
function updateMap(){
  if(!lmap)return;
  mmk.forEach(m=>lmap.removeLayer(m));mmk=[];
  routeLayers.forEach(l=>lmap.removeLayer(l));routeLayers=[];
  for(let d=0;d<3;d++){
    if(!mfa[d])continue;
    const evts=S.events.filter(e=>e.day===d&&e.lat&&e.lng).sort((a,b)=>t2m(a.start)-t2m(b.start));
    const color=DC[d].hi;
    for(let i=0;i<evts.length-1;i++){
      const p1=[evts[i].lat,evts[i].lng],p2=[evts[i+1].lat,evts[i+1].lng];
      const dlat=p2[0]-p1[0],dlng=p2[1]-p1[1];
      if(Math.abs(dlat)<1e-6&&Math.abs(dlng)<1e-6)continue;
      routeLayers.push(L.polyline([p1,p2],{color,weight:2.5,opacity:.65,dashArray:'8,5'}).addTo(lmap));
      const aLat=p1[0]+dlat*0.6,aLng=p1[1]+dlng*0.6;
      const angle=Math.atan2(dlng,dlat)*180/Math.PI;
      const arrowIcon=L.divIcon({
        html:`<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(${angle}deg);transform-origin:8px 8px;display:block;"><polygon points="8,1 15,15 8,11 1,15" fill="${color}" opacity="0.9"/></svg>`,
        className:'',iconSize:[16,16],iconAnchor:[8,8]
      });
      routeLayers.push(L.marker([aLat,aLng],{icon:arrowIcon,interactive:false}).addTo(lmap));
    }
  }
  S.events.forEach(ev=>{
    if(!ev.lat||!ev.lng||!mfa[ev.day])return;
    const order=S.events.filter(e=>e.day===ev.day&&e.lat&&e.lng).sort((a,b)=>t2m(a.start)-t2m(b.start)).findIndex(e=>e.id===ev.id)+1;
    const color=DC[ev.day].hi;
    const pinIcon=L.divIcon({
      html:`<div style="width:28px;height:28px;background:${color};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;font-family:sans-serif;">${order}</span></div>`,
      className:'',iconSize:[28,28],iconAnchor:[14,28]
    });
    const m=L.marker([ev.lat,ev.lng],{icon:pinIcon}).addTo(lmap);
    m.bindPopup(`<b>${ev.title}</b><br><small>${ev.start}–${ev.end}</small>${ev.loc?'<br>📍 '+ev.loc:''}`);
    mmk.push(m);
  });
}

/* ── Google Maps 경로 ── */
function openGoogleMaps(){
  const activeDay=mfa.findIndex(f=>f);
  if(activeDay===-1)return;
  const evts=S.events.filter(e=>e.day===activeDay&&e.loc).sort((a,b)=>t2m(a.start)-t2m(b.start));
  if(evts.length<2){alert('같은 날 장소가 2개 이상 있어야 경로를 볼 수 있어요');return;}
  const stops=evts.map(e=>encodeURIComponent(e.loc));
  window.open(`https://www.google.com/maps/dir/${stops.join('/')}`, '_blank');
}

/* ── Event Modal ── */
function resetEvModal(){
  document.getElementById('savebtn').textContent='저장';
  document.getElementById('savebtn').disabled=false;
  document.getElementById('geobtn').textContent='🔍';
  document.getElementById('geobtn').disabled=false;
  document.getElementById('geost').innerHTML='<span class="geo-hint">한국어·일본어·영어 모두 검색 가능</span>';
}
function openEM(id,pd,pt){
  eid=id||null;pendingCoords=null;
  resetEvModal();
  if(id){
    const ev=S.events.find(e=>e.id===id);
    document.getElementById('emtitle').textContent='일정 수정';
    document.getElementById('en').value=ev.title;
    document.getElementById('ed').value=ev.day;
    document.getElementById('es').value=ev.start;
    document.getElementById('ee').value=ev.end;
    document.getElementById('el').value=ev.loc||'';
    if(ev.lat&&ev.lng){
      pendingCoords={lat:ev.lat,lng:ev.lng};
      document.getElementById('geost').innerHTML=`<span class="geo-ok">✓ 좌표 저장됨 (${ev.lat.toFixed(4)}, ${ev.lng.toFixed(4)})</span>`;
    }
    setTog(ev.fixed);document.getElementById('edelbtn').style.display='block';
  }else{
    document.getElementById('emtitle').textContent='일정 추가';
    document.getElementById('en').value='';
    document.getElementById('ed').value=pd??0;
    document.getElementById('es').value=pt||'12:00';
    document.getElementById('ee').value=m2t(Math.min(t2m(pt||'12:00')+60,EH*60));
    document.getElementById('el').value='';
    setTog(true);document.getElementById('edelbtn').style.display='none';
  }
  document.getElementById('emd').classList.add('open');
}
function closeEM(){
  document.getElementById('emd').classList.remove('open');
  eid=null;pendingCoords=null;
  resetEvModal();
}
async function saveEv(){
  const name=document.getElementById('en').value.trim();
  if(!name){document.getElementById('en').focus();return;}
  const locText=document.getElementById('el').value.trim();
  const btn=document.getElementById('savebtn');
  // 장소 입력 있고 아직 좌표 없으면 Geocoding으로 한 번 더 시도 (자동완성 안 쓴 경우 fallback)
  if(locText&&!pendingCoords){
    btn.textContent='검색 중...';btn.disabled=true;
    try{
      const result=await geocodeWithGoogle(locText);
      if(result)pendingCoords={lat:result.lat,lng:result.lng};
    }catch(e){console.warn(e);}
    finally{btn.textContent='저장';btn.disabled=false;}
  }
  const ev={title:name,day:parseInt(document.getElementById('ed').value),start:document.getElementById('es').value,end:document.getElementById('ee').value,loc:locText,fixed:document.getElementById('etog').classList.contains('on'),lat:pendingCoords?.lat||null,lng:pendingCoords?.lng||null};
  if(eid){const x=S.events.find(e=>e.id===eid);if(x)Object.assign(x,ev);}
  else S.events.push({id:'ev'+Date.now(),...ev});
  saveDB();render();closeEM();
}
function delEv(){
  if(!eid)return;
  S.events=S.events.filter(e=>e.id!==eid);
  saveDB();render();closeEM();
}
function setTog(on){
  document.getElementById('etog').classList.toggle('on',on);
  document.getElementById('etlbl').textContent=on?'고정 일정':'가변 일정';
}
document.getElementById('etog').onclick=function(){
  this.classList.toggle('on');
  document.getElementById('etlbl').textContent=this.classList.contains('on')?'고정 일정':'가변 일정';
};
document.getElementById('emd').onclick=e=>{if(e.target===document.getElementById('emd'))closeEM();};

/* ── Wish Modal ── */
function openWM(){
  pendingWCoords=null;
  document.getElementById('wn').value='';
  document.getElementById('wl').value='';
  document.getElementById('wsavebtn').textContent='추가';
  document.getElementById('wsavebtn').disabled=false;
  document.getElementById('wmd').classList.add('open');
}
function closeWM(){document.getElementById('wmd').classList.remove('open');}
async function saveW(){
  const name=document.getElementById('wn').value.trim();
  if(!name){document.getElementById('wn').focus();return;}
  const locText=document.getElementById('wl').value.trim();
  const wishItem={id:'w'+Date.now(),title:name,loc:locText,lat:pendingWCoords?.lat||null,lng:pendingWCoords?.lng||null};
  S.wishlist.push(wishItem);
  saveDB();renderWish();closeWM();
  // 자동완성으로 좌표 못 받은 경우 백그라운드 Geocoding
  if(locText&&!pendingWCoords){
    geocodeWithGoogle(locText).then(result=>{
      if(!result)return;
      const idx=S.wishlist.findIndex(w=>w.id===wishItem.id);
      if(idx>=0){S.wishlist[idx].lat=result.lat;S.wishlist[idx].lng=result.lng;saveDB();renderWish();}
    }).catch(()=>{});
  }
}
function delW(id){S.wishlist=S.wishlist.filter(w=>w.id!==id);saveDB();renderWish();}
function dropW(wid,day,sm){
  const w=S.wishlist.find(x=>x.id===wid);if(!w)return;
  S.events.push({id:'ev'+Date.now(),title:w.title,day,start:m2t(sm),end:m2t(Math.min(sm+60,EH*60)),fixed:false,loc:w.loc||'',lat:w.lat||null,lng:w.lng||null});
  S.wishlist=S.wishlist.filter(x=>x.id!==wid);
  saveDB();render();
}
document.getElementById('wmd').onclick=e=>{if(e.target===document.getElementById('wmd'))closeWM();};

function render(){renderCal();renderWish();updateMap();}

async function boot(){
  await loadDB();
  render();
  initMap();
  listenRT();
  loadGoogleMaps(); // Google Maps API 비동기 로드
}
boot();
</script>
